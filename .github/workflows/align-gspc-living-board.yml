name: Align GSPC living board

on:
  push:
    paths:
      - '.github/workflows/align-gspc-living-board.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale GSPC one-liner when present
        run: |
          set -euo pipefail
          STALE='(14 measured of 14 axes, Ed25519-signed board, stranger verify at /gspc-verify)'
          if grep -F -q "$STALE" README.md; then
            sed -i 's|(14 measured of 14 axes, Ed25519-signed board, stranger verify at /gspc-verify)|(quote totals.public_count from GET /api/gspc — living board 22 axis · 15 measured, Ed25519-signed board, stranger verify at /gspc-verify/)|g' README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "align: living GSPC board 22 axis · 15 measured"
            git push
          else
            echo "No stale GSPC one-liner; nothing to commit"
          fi
